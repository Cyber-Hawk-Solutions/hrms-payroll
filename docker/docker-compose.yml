version: "3.8"

services:
  mariadb:
    image: mariadb:10.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123}
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-123}"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:alpine
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  frappe:
    image: frappe/bench:latest
    command: bash /workspace/init.sh
    environment:
      SHELL: /bin/bash

      SITE_NAME: ${SITE_NAME:-hrms.localhost}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}

      DB_HOST: mariadb
      REDIS_CACHE: redis:6379
      REDIS_QUEUE: redis:6379
      REDIS_SOCKETIO: redis:6379
      FRAPPE_SITE_NAME_HEADER: $$host
    working_dir: /home/frappe
    volumes:
      - .:/workspace
      - bench-data:/home/frappe/frappe-bench
    expose:
      - "8000"
      - "9000"
    networks:
      - dokploy-network
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mariadb-data:
  bench-data:

networks:
  dokploy-network:
    external: true
